name: whoop_buzz
description: Manual haptic control for a WHOOP 5.0 strap over BLE (community-reverse-engineered protocol).
publish_to: 'none'
version: 0.5.1+6

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_blue_plus: ^1.35.0
  permission_handler: ^11.3.1
  shared_preferences: ^2.2.3
  wakelock_plus: ^1.2.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
